# CargoTrak logging.

log4j.rootLogger=INFO, FILE, CONSOLE

# console appender
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} %-5p [%X{user}] %c{1} - %m%n

# rolling file appender (the LogViewerServlet reads from /var/app/cargo/logs/)
log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=/var/app/cargo/logs/cargotrak.log
log4j.appender.FILE.MaxFileSize=10MB
log4j.appender.FILE.MaxBackupIndex=5
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{ISO8601} %-5p [%X{user}] %c - %m%n

# SMTP appender for ERROR-level events
log4j.appender.SMTP=org.apache.log4j.net.SMTPAppender
log4j.appender.SMTP.Threshold=ERROR
log4j.appender.SMTP.SMTPHost=localhost
log4j.appender.SMTP.From=cargotrak-alerts@cargotrak.local
log4j.appender.SMTP.To=ops@cargotrak.local
log4j.appender.SMTP.Subject=[CargoTrak][ERROR] alert
log4j.appender.SMTP.BufferSize=10
log4j.appender.SMTP.layout=org.apache.log4j.PatternLayout
log4j.appender.SMTP.layout.ConversionPattern=%d{ISO8601} %-5p %c - %m%n

# tame the noisy frameworks
log4j.logger.org.hibernate=WARN
log4j.logger.org.springframework=WARN
log4j.logger.org.apache.struts=WARN
log4j.logger.org.quartz=INFO
log4j.logger.org.apache.axis=WARN
log4j.logger.org.apache.commons=WARN

# CargoTrak own loggers
log4j.logger.com.acme.cargotrak=INFO
log4j.logger.com.acme.cargotrak.dao=INFO
log4j.logger.com.acme.cargotrak.action=INFO
log4j.logger.com.acme.cargotrak.job=INFO
