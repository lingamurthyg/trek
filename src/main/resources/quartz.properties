# Quartz 2.3.2 configuration.
# Migrated from Quartz 1.8.6 to Quartz 2.3.2 for Java 21 compatibility.
# Most settings are passed via SchedulerFactoryBean in applicationContext.xml,
# but a few bits (job-store recovery) read this file when present.

org.quartz.scheduler.instanceName        = CargoTrakScheduler
org.quartz.scheduler.instanceId          = AUTO
org.quartz.scheduler.skipUpdateCheck     = true

org.quartz.threadPool.class              = org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount        = 5
org.quartz.threadPool.threadPriority     = 5

org.quartz.jobStore.class                = org.quartz.simpl.RAMJobStore
